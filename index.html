<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian Etole | Visual Storyteller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              charcoal: '#0A0A0A',
              'off-white': '#F5F5F5',
              terracotta: '#C26A44',
              olive: '#3A4D39',
              gold: '#D4AF37',
              amber: '#FF8C42',
            }
          }
        }
      }
    </script>
    <style>
        body {
            background-color: #F5F5F5; /* off-white */
            color: #0A0A0A; /* charcoal */
            font-family: 'Inter', sans-serif;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        
        /* Text reveal animation */
        @keyframes reveal-text {
            from { transform: translateY(110%); }
            to { transform: translateY(0); }
        }
        .heading-line {
            display: block;
            overflow: hidden;
        }
        .heading-line span {
            display: block;
            transform: translateY(110%);
            animation: reveal-text 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Fade in up animation */
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out forwards;
        }
        .animate-zoom-in {
             animation: zoom-in 0.5s ease-out forwards;
        }
        @keyframes zoom-in {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }


        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #C26A44; /* terracotta */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: #D4AF37; /* gold */
        }
    </style>
